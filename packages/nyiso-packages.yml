summary: >-
  NYISO ships no client libraries. There is no first-party SDK in any language,
  no CLI, no published Postman collection and no NYISO GitHub organization - the
  github.com/nyiso account exists but is an empty, unverified user with no
  repositories and is NOT recorded as an official NYISO presence. What does
  exist is a small third-party ecosystem that wraps the open MIS archive; those
  libraries are catalogued below with official set to false so no SDK pointer is
  claimed for NYISO.
