aid: nyiso
name: New York Independent System Operator (NYISO)
review:
  question: What real, public API surface does NYISO expose, and what energy-data
    obligation actually applies to it?
  date: '2026-07-27'
  reviewer: API Evangelist
  tier: system-operator
  homeMarket: United States
  primaryDomain: nyiso.com
  verdict: >
    NYISO is the sector's split personality in one organization. Its market and
    system data is wide open and anonymous - a sixty-report-family bulk CSV/ZIP
    archive at mis.nyiso.com/public and a publicly listable OASIS postings object
    store at oasis-postings.nyiso.com, both answering 200 with no credentials of
    any kind. Its actual REST APIs are the exact opposite - six documented
    market-participant surfaces under api.nyiso.com, every one of which answered
    401 Authorization Required to an anonymous probe, gated behind an MIS user
    account plus a NAESB-accredited digital certificate. There is no consumer
    data surface at all and no consumer data mandate applies. NYISO publishes no
    machine-readable API contract anywhere, so nothing was harvested into
    openapi/ and nothing was authored.
mandate:
  regime: other
  regimeName: >
    FERC open-access transparency obligations on a jurisdictional transmission
    provider and ISO - principally Order No. 889 and Order No. 890, which require
    an Open Access Same-Time Information System (OASIS), plus the market-data
    posting requirements embedded in NYISO's FERC-approved Open Access
    Transmission Tariff and Market Administration and Control Area Services
    Tariff. This is a WHOLESALE transparency mandate. It is emphatically NOT a
    consumer data right.
  status: live-implemented
  statusEvidence: >
    The obligation and the implementation were checked as separate facts. The
    obligation is a FERC requirement on NYISO as a jurisdictional ISO. The
    implementation was verified by direct anonymous HTTP probe on 2026-07-27, not
    by reading a compliance page. NYISO operates a live OASIS node at
    http://oasis.nyiso.com/ (200, single-page application) backed by
    https://oasis-postings.nyiso.com, which answered an anonymous S3 ListBucket
    request with 200 application/xml and served
    ACTIVE_TRANSMISSION_NODE/CSV/activetransmissionnodes.csv at 200 text/csv, with
    ATC_TTC posting keys dated back to 1999-11-18. Separately, the MIS public
    archive at http://mis.nyiso.com/public/ answered 200 and served live daily
    CSV for day-ahead LBMP, real-time LBMP, actual load, fuel mix and load
    forecast, plus monthly ZIP bundles. This is an implementation, not a claim.
  mandateVersusImplementationCaveat: >
    One boundary is drawn deliberately. NYISO's OASIS node is verified LIVE, but
    conformance to the NAESB WEQ-001 OASIS Business Practice Standards template
    interface was NOT verified. Template-style request paths under
    oasis.nyiso.com (for example /oasis/data/nyiso/system_data, /oasis/data,
    /OASIS/) all returned 200 text/html, which is the SPA's index shell answering
    every unmatched route, not a WEQ-001 template response. The correct record is
    "OASIS node live and openly readable", not "WEQ-001 conformant".
  notMandated: >
    NO consumer energy data-portability mandate applies to NYISO. The United
    States has Green Button as a real NAESB/NIST-derived standard with nothing
    federally compelling anyone to adopt it, and in any case Green Button and
    ESPI bind DISTRIBUTION UTILITIES holding retail customer relationships - in
    New York that means Con Edison, National Grid, NYSEG, RG&E, Central Hudson,
    Orange & Rockland and PSEG Long Island under New York PSC / REV proceedings -
    not the wholesale system operator. `green-button-voluntary` was considered
    and rejected as the regime for THIS organization because NYISO has no retail
    customers, holds no interval consumption data for individual premises, and
    makes no Green Button claim anywhere on its site. `cdr-energy` and
    `green-button-ontario` are geographically inapplicable.
    `smart-meter-infrastructure` was considered and rejected because the US has
    no DCC-style national metering data infrastructure and NYISO is not one.
  registerEntry: >
    Not applicable - no CDR or equivalent accredited-recipient register exists for
    US energy, and no register entry was sought or found.
dataStandard:
  standard: no consumer-data standard reference found
  detail: >
    No Green Button, no ESPI, no CDR Consumer Data Standards, no IEC CIM
    61968/61970, no IEEE 2030.5, no OpenADR, no OCPP/OCPI reference was found on
    any NYISO surface. The one named industry standard genuinely in play is NAESB
    - on two axes, and only one of them is a data schema. First, NAESB WEQ-001
    OASIS Business Practice Standards sit behind the FERC OASIS obligation, but as
    recorded above conformance to the WEQ-001 template interface was not verified.
    Second, and this one IS verified from the published guides, NYISO's REST APIs
    authenticate with a NAESB-accredited digital certificate under the NAESB PKI /
    Authorized Certification Authority regime - NAESB here is an identity standard,
    not a payload standard. The API payloads themselves are a NYISO-proprietary
    JSON shape defined only in the user guides, using ISO-8601 for dates and times
    with Eastern offsets. The open bulk data is NYISO-proprietary CSV with a stable
    URL convention and no published schema document.
dataSplit:
  marketDataOpen: true
  marketDataDetail: >
    Wide open, and this is the substantial surface. The MIS public archive index
    at http://mis.nyiso.com/public/menu.htm enumerates roughly sixty report
    families - zonal and generator day-ahead LBMP (P-2A/P-2B), real-time LBMP
    (P-24A/P-24B, P-4A/P-4B), ancillary services for both real-time and day-ahead
    (P-6B, P-5), reference bus LBMP, price correction logs, CTS prices, real-time
    and day-ahead outages (P-54A/B/C), outage schedules, generation maintenance,
    limiting constraints (P-33, P-511A), interface limits and flows (P-32), Lake
    Erie circulation, PAR schedules and flows, ATC/TTC and long-term ATC/TTC
    (P-8, P-8A), TTC forecast, grandfathered transmission rights, ISO load
    forecast (P-7), zonal bid load, weather forecast, real-time actual and
    integrated actual load (P-58B/P-58C), day-ahead daily energy report, NYISO
    capacity report, balancing market advisory, real-time events, real-time fuel
    mix (P-63), operational announcements, operator-initiated commitments, zonal
    and resource uplift (P-45, P-46), day-ahead and real-time IMER, ICAP zonal
    forecast/estimated actuals/tracking (P-70A/B/C), NYISO bid data (P-27),
    economic dispatch analysis, generator and load names, active transmission
    nodes, transmission owner information, subzones by transmission owner,
    subzone definitions, and the DOE EIA-930 same-day hourly and daily demand
    postings. Every one is fetchable anonymously. Plus the OASIS postings bucket
    with anonymous listing and 1999-to-present history.
  consumerDataApi: false
  consumerDataDetail: >
    Zero. NYISO exposes no individual customer usage, billing, consent or
    account-level data through any API, and no consent flow, accredited-recipient
    concept or customer-authorization surface exists. This is structurally correct
    rather than a gap - the system operator has no retail customers. NYISO's
    "metering" APIs are revenue-grade WHOLESALE settlement metering for generators,
    ties and subzones, which is easy to mistake for consumer metering and is not
    remotely the same thing. In the US, individual consumption data sits with the
    distribution utilities and, in practice, with the private resale layer
    (Arcadia, UtilityAPI, Genability) rather than with any ISO.
  theFinding: >
    NYISO is a clean two-speed provider - completely open on market and system
    data, completely absent on consumer data, and completely closed on its only
    true REST APIs. The bulk archive is the most usable thing NYISO ships and it
    has no API contract; the things that ARE APIs cannot be reached without
    becoming a market participant. Do not collapse this into a single open/closed
    verdict.
accessGate:
  gate: self-serve
  gateForRestApis: accredited-only
  gated: true
  whatADeveloperMustDo: >
    Two completely different answers depending on which surface you want. For the
    open data - nothing. No sign-up, no key, no application, no licence
    click-through, no referrer or cookie requirement. Issue an HTTP or HTTPS GET
    against http://mis.nyiso.com/public/csv/<report>/<YYYYMMDD><report>.csv or a
    monthly bundle at .../<YYYYMM01><report>_csv.zip, or against
    https://oasis-postings.nyiso.com/<KEY>, and you get CSV. For the REST APIs -
    a great deal. You must be a registered NYISO Market Participant, hold a valid
    MIS user account with the relevant metering/settlement privileges granted
    through the NYISO Marketplace administrator system (per the Settlement Data
    Applications User's Guide), and obtain a digital certificate from a
    NAESB-Authorized Certification Authority bound to that MIS account (per the
    Market Participant User's Guide). There is no public sandbox self-signup - the
    market-trial environment at apitest.nyiso.com is also credentialed and
    returned 401. Onboarding runs through NYISO Stakeholder Services
    (Stakeholder_Services@nyiso.com, 518.356.6060), not through a developer portal.
  developerPortal: >
    There is no developer portal in the conventional sense. developer.nyiso.com,
    developers.nyiso.com, docs.nyiso.com and data.nyiso.com all fail DNS
    resolution. /developers, /api and /docs on www.nyiso.com all return 404. The
    real self-serve entry points are the Energy Market & Operational Data hub at
    https://www.nyiso.com/energy-market-operational-data (200, anonymous) and the
    MIS public archive itself at http://mis.nyiso.com/public/ (200, anonymous).
    API documentation is distributed as PDF user guides filed under
    https://www.nyiso.com/manuals-tech-bulletins-user-guides, not as a hosted
    reference site.
authModel:
  openSurfaceScheme: none
  restApiScheme: HTTP Basic over TLS 1.2 plus NAESB client certificate (two-factor)
  detail: >
    The open surfaces are unauthenticated anonymous HTTP GET - no key, no OAuth2,
    no OIDC, no mTLS. The REST APIs are explicitly two-factor per both published
    guides - "A valid MIS user account and associated password must be provided
    using Basic authentication" AND "The NAESB certificate associated with the MIS
    user account must be provided with each request". All endpoints are HTTPS 1.1
    over TLS 1.2. The 401 responses are emitted by nginx with a plain HTML body,
    consistent with Basic-auth enforcement at the edge. No OAuth2, no OpenID
    Connect, and no token endpoint of any kind is documented or discoverable.
  wellKnownProbe: >
    https://www.nyiso.com/.well-known/openid-configuration -> HTTP 404.
    https://api.nyiso.com/.well-known/openid-configuration -> HTTP 404 (served by
    awselb/2.0 with body "Page Not Found"). No OIDC discovery document exists
    anywhere on NYISO infrastructure.
