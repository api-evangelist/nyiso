specHarvest:
  harvested: false
  specsCount: 0
  openapiDirectoryOmitted: true
  detail: >
    NYISO publishes no machine-readable API contract of any kind. No OpenAPI, no
    Swagger, no WSDL, no JSON Schema, no Postman collection was found on
    www.nyiso.com, api.nyiso.com, apitest.nyiso.com, oasis.nyiso.com,
    oasis-postings.nyiso.com or mis.nyiso.com. Every /openapi.json,
    /swagger.json, /api-docs and /.well-known/ probe returned 404. API
    documentation exists only as PDF user guides (Metering API User Guide, Finance
    APIs User's Guide v1.2 DRAFT), which do document real request/response shapes
    and real endpoint paths - but a spec derived from those PDFs would be authored
    by API Evangelist, not harvested from NYISO, so none was written. The open
    bulk-data surfaces are file archives with a URL convention rather than REST
    APIs, and have no contract to harvest either.
notes:
  seamContext: >
    NYISO is one of the seven US ISOs/RTOs. Within the Green Button market seam it
    belongs to the wholesale market-operator layer that publishes genuine open
    market data, sitting entirely apart from the consumer-data question that Green
    Button, ESPI, and the Australian CDR address. Its distinguishing trait against
    peers is that the open surface is bulk-file-shaped rather than API-shaped -
    NYISO gives you excellent data with no contract, while reserving all of its
    actual REST engineering for credentialed market participants.
  retirementSignal: >
    NYISO retired the SDX upload/download application on 2025-09-17 and moved
    market participants onto the Finance APIs. That is a genuine legacy-to-API
    modernization event, and it happened entirely on the gated side of the split.
  documentationMaturityCaveat: >
    The Finance APIs User's Guide is watermarked "DRAFT - FOR DISCUSSION PURPOSES
    ONLY" on every page, and the Metering API User Guide carries "DRAFT PURPOSES
    ONLY" plus an explicit note that "This common URL root has not yet been
    finalized". Yet api.nyiso.com is demonstrably live and enforcing auth, and SDX
    is retired. The production system has outrun its own published documentation.
