apis:
- aid: nyiso:nyiso-mis-public-data
  name: NYISO MIS Public Data Archive
  description: NYISO's Market Information System public archive - the operator's
    flagship open data surface. Roughly sixty machine-readable report families are
    published as predictable daily CSV files and monthly ZIP bundles under a stable
    path convention, covering day-ahead and real-time zonal and generator LBMP,
    ancillary services prices, ISO load forecast, real-time and integrated actual
    load, real-time fuel mix, ATC/TTC and long-term ATC/TTC, transmission and
    generation outages, limiting constraints, interface limits and flows, PAR
    schedules and flows, Lake Erie circulation, bid data, capacity reports, zonal
    and resource uplift, generator and load reference names, active transmission
    nodes, subzone definitions, and the DOE EIA-930 hourly demand postings. Fully
    anonymous over plain HTTP and HTTPS - no key, no account, no application, no
    licence click-through. Verified by direct probe on 2026-07-27 - for example
    csv/damlbmp/20260725damlbmp_zone.csv, csv/realtime/20260725realtime_zone.csv,
    csv/pal/20260725pal.csv, csv/rtfuelmix/20260725rtfuelmix.csv and
    csv/isolf/20260725isolf.csv each returned 200 text/csv, and monthly bundles
    such as csv/damlbmp/20260701damlbmp_zone_csv.zip returned 200. This is a
    file-based data surface with a URL convention, not a REST API, and NYISO
    publishes no OpenAPI, WSDL or JSON contract for it.
  humanURL: https://www.nyiso.com/energy-market-operational-data
  baseURL: http://mis.nyiso.com/public
