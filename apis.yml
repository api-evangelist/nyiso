- aid: nyiso:nyiso-finance-settlements-api
  name: NYISO Finance Settlements API
  description: The Settlements component of NYISO's Finance APIs. The published
    guide documents GET /v1/stationPower, retrieving station power settlement data
    by billing month with an optional version parameter, as JSON over HTTPS 1.1
    with TLS 1.2. Restricted to NYISO market participants under the same two-factor
    scheme as the rest of the Finance APIs - MIS user account and password via HTTP
    Basic plus the associated NAESB certificate on every request. The root and the
    stationPower endpoint both returned 401 Authorization Required to anonymous
    probes on 2026-07-27.
  humanURL: https://www.nyiso.com/documents/20142/45334160/NYISO%20Finance%20APIs%20User's%20Guide%20v1.2%20-%20DRAFT.pdf/4f0de58a-783d-a317-64fe-caed77ba61fa
