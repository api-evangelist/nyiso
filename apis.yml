- aid: nyiso:nyiso-finance-invoicing-api
  name: NYISO Finance Invoicing API
  description: The Invoicing component of NYISO's Finance APIs, retrieving daily
    reconciliation data for both settlements dollars and energy volumes. The
    published guide documents GET /v1/dailyReconciliation/dollar and GET
    /v1/dailyReconciliation/mwh, parameterised by start date and an optional
    version, returning JSON with two decimals of dollar precision and four decimals
    of MWh precision. Restricted to NYISO market participants - MIS user account
    and password via HTTP Basic plus the associated NAESB certificate on every
    request. Both the root and /v1/dailyReconciliation/dollar returned 401
    Authorization Required to anonymous probes on 2026-07-27.
  humanURL: https://www.nyiso.com/documents/20142/45334160/NYISO%20Finance%20APIs%20User's%20Guide%20v1.2%20-%20DRAFT.pdf/4f0de58a-783d-a317-64fe-caed77ba61fa
