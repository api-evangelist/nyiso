generated: '2026-07-27'
method: derived
source: >-
  Derived from the NYISO Finance APIs User's Guide v1.2 DRAFT and the NYISO
  Metering API User Guide for the REST entities, and from live fetches of
  http://mis.nyiso.com/public/menu.htm, every report index page and ten live CSV
  files on 2026-07-27 for the public data catalogue. NYISO publishes no
  machine-readable schema for either surface.
summary: >-
  Everything NYISO publishes hangs off one identifier - the PTID, a NYISO-defined
  integer point identifier for a zone, generator, tie, subzone, load bus or
  transmission node - and one time key, the service hour or five-minute interval
  in Eastern time. The REST APIs address PTIDs directly in JSON; the public
  archive addresses the same PTIDs in dated CSV files. The three reference files
  (Generator Names P-19, Load Names P-20, Active Transmission Nodes P-66) are the
  join tables that make every other report resolvable.

keys:
- key: ptid
  type: integer
  description: >-
    Unique NYISO-defined point identifier. Appears as genPtid, tiePtid,
    subzonePtid and busPtid in the REST payloads and as a PTID column in nearly
    every CSV report.
  resolvers:
  - http://mis.nyiso.com/public/csv/generator/generator.csv
  - http://mis.nyiso.com/public/csv/load/load.csv
  - http://mis.nyiso.com/public/csv/activetransmissionnodes/activetransmissionnodes.csv
  - https://oasis-postings.nyiso.com/ACTIVE_TRANSMISSION_NODE/CSV/activetransmissionnodes.csv
- key: dateHour
  type: ISO-8601 date/time (REST) or MM/DD/YYYY HH:MM (CSV)
  description: Service hour for metering data; five-minute interval for real-time reports.
- key: billingMonth
  type: ISO-8601 month (yyyy-MM)
  description: Settlement month used to select metering, settlement and invoicing data.
- key: version
  type: number with one decimal place, 0 = latest
  description: Invoice version of settlement data.

entities:
- name: Generator
  surface: rest
  api: NYISO Finance Metering API / NYISO Metering API
  identifier: genPtid
  fields:
  - genPtid
  - dateHour
  - meterInjectionEnergyMwh
  - meterWithdrawalEnergyMwh
  - meterDemandReductionMwh
  - version
  description: >-
    Revenue-grade hourly meter data for a generator, submitted by a Meter
    Authority. Injection and withdrawal are constrained to the range
    -10,000.0000 to 10,000.0000 MWh with four decimal places, and each field is
    permitted only for a generator with the matching capability.
  operations:
  - POST /v1/powerMetering
  - GET /v1/powerMetering
- name: Tie
  surface: rest
  api: NYISO Finance Metering API / NYISO Metering API
  identifier: tiePtid
  fields: [tiePtid, dateHour, meterTieFlowMwh, version]
  description: Revenue-grade hourly metered flow across an interconnection tie.
  operations: [POST /v1/powerMetering, GET /v1/powerMetering]
- name: Subzone
  surface: rest
  api: NYISO Finance Metering API / NYISO Metering API
  identifier: subzonePtid
  fields: [subzonePtid, dateHour, meterSubzoneLoadMwh, version]
  description: Revenue-grade hourly metered subzone load.
  operations: [POST /v1/powerMetering, GET /v1/powerMetering]
- name: CalculatedSubzoneLoad
  surface: rest
  api: NYISO Finance Metering API / NYISO Metering API
  identifier: subzonePtid
  description: >-
    NYISO-calculated subzone load derived from submitted metering, available in
    summary and detail form.
  operations:
  - GET /v1/calculatedSubzoneLoad/summary
  - GET /v1/calculatedSubzoneLoad/detail
  derived_from: [Generator, Tie, Subzone]
- name: TransmissionOwnerLoad
  surface: rest
  api: NYISO Finance Metering API
  identifier: busPtid
  description: >-
    Transmission owner load (TOL) submitted per load bus, plus NYISO load
    verification data in summary and detail form.
  operations:
  - POST /v1/transmissionOwnerLoad
  - GET /v1/transmissionOwnerLoad
  - GET /v1/transmissionOwnerLoad/verification/summary
  - GET /v1/transmissionOwnerLoad/verification/detail
- name: GeneratorPerformance
  surface: rest
  api: NYISO Finance Metering API
  identifier: genPtid
  description: Generator performance data retrieval.
  operations: [GET /v1/generatorPerformance]
- name: MinOilBurnEvent
  surface: rest
  api: NYISO Finance Metering API
  description: >-
    Minimum oil burn event data, submitted separately by transmission owners and
    by qualified generators and retrievable in combined form.
  operations:
  - POST /v1/minOilBurnEvent/transmissionOwner
  - POST /v1/minOilBurnEvent/generator
  - GET /v1/minOilBurnEvent
- name: StationPower
  surface: rest
  api: NYISO Finance Settlements API
  description: Station power settlement detail for a billing month, with optional invoice version.
  operations: [GET /v1/stationPower]
- name: DailyReconciliation
  surface: rest
  api: NYISO Finance Invoicing API
  identifier: dailyReconciliationCode
  fields: [dailyReconciliationCode, revenues, expenditures, version]
  description: >-
    Daily reconciliation of settlement dollars and energy volumes, selectable by
    billingMonth or by a startDate/endDate range of at most 31 days, optionally
    including NYISO-wide aggregate sums.
  operations:
  - GET /v1/dailyReconciliation/dollar
  - GET /v1/dailyReconciliation/mwh

relationships:
- from: CalculatedSubzoneLoad
  to: Subzone
  type: belongs_to
  via: subzonePtid
  evidence: Calculated subzone load is retrieved and reported per subzone PTID.
- from: Generator
  to: ActiveTransmissionNode
  type: belongs_to
  via: PTID
  evidence: >-
    Generator PTIDs resolve against the Active Transmission Nodes and Generator
    Names reference files, which carry Node Name, PTID, Subzone and Zone.
- from: ActiveTransmissionNode
  to: Subzone
  type: belongs_to
  via: Subzone column
  evidence: 'activetransmissionnodes.csv header: "Node Name","PTID","Subzone","Zone".'
- from: Subzone
  to: Zone
  type: belongs_to
  via: Zone column
  evidence: Same reference file; subzone definitions are published separately as report P-36.
- from: DailyReconciliation
  to: StationPower
  type: none
  via: null
  evidence: >-
    No cross-reference between invoicing and settlements payloads is documented;
    recorded explicitly as absent rather than inferred.

